services:
  - type: web
    name: restaurant-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && PYTHONPATH=backend python database/seed/seed_data.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.7"
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://*.vercel.app","https://*.vercel.dev","http://localhost:3000"]'
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: restaurant-redis
          property: connectionString

  - type: keyvalue
    name: restaurant-redis
    plan: free
    ipAllowList: []

databases:
  - name: restaurant-db
    plan: free
    databaseName: restaurant_db
    user: restaurant_user
